{% extends "base.html" %}

{% block title %}Register - Perfume Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Register</h1>
    <form id="register-form" class="auth-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required minlength="6">
        </div>
        <div class="error-message" id="error-message"></div>
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p class="auth-link">Already have an account? <a href="/app/login">Login</a></p>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = {
            email: formData.get('email'),
            password: formData.get('password')
        };
        
        try {
            const response = await fetch('/auth/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            
            if (response.ok) {
                window.location.href = '/app/login?registered=1';
            } else {
                const error = await response.json();
                document.getElementById('error-message').textContent = error.detail || 'Registration failed';
            }
        } catch (err) {
            document.getElementById('error-message').textContent = 'Connection error';
        }
    });
</script>
{% endblock %}
