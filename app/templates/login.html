{% extends "base.html" %}

{% block title %}Login - Perfume Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Login</h1>
    <form id="login-form" class="auth-form">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="error-message" id="error-message"></div>
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
        <div class="oauth-divider"><span>or</span></div>
        <a href="/oauth/google" class="btn btn-google">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google logo" class="google-logo"> Login with Google
        </a>
    <p class="auth-link">Don't have an account? <a href="/app/register">Register</a></p>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const data = {
            email: formData.get('email'),
            password: formData.get('password')
        };
        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (response.ok) {
                const data = await response.json();
                localStorage.setItem('access_token', data.access_token);
                const userResponse = await fetch('/auth/me', {
                    headers: { 'Authorization': `Bearer ${data.access_token}` }
                });
                if (userResponse.ok) {
                    const user = await userResponse.json();
                    localStorage.setItem('user_role', user.role);
                    if (user.role === 'ADMIN') {
                        window.location.href = '/app/admin';
                    } else {
                        window.location.href = '/app/perfumes';
                    }
                } else {
                    window.location.href = '/app/perfumes';
                }
            } else {
                const error = await response.json();
                document.getElementById('error-message').textContent = error.detail || 'Login failed';
            }
        } catch (err) {
            document.getElementById('error-message').textContent = 'Connection error';
        }
    });
</script>
{% endblock %}
