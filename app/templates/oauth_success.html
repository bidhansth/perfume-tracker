{% extends "base.html" %}

{% block title %}OAuth Success - Perfume Tracker{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Logging you in...</h1>
    <div class="error-message" id="error-message"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Parse token from URL
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (token) {
        localStorage.setItem('access_token', token);
        // Fetch user info to get role
        fetch('/auth/me', {
            headers: { 'Authorization': `Bearer ${token}` }
        }).then(async response => {
            if (response.ok) {
                const user = await response.json();
                localStorage.setItem('user_role', user.role);
                if (user.role === 'ADMIN') {
                    window.location.href = '/app/admin';
                } else {
                    window.location.href = '/app/perfumes';
                }
            } else {
                window.location.href = '/app/perfumes';
            }
        }).catch(() => {
            document.getElementById('error-message').textContent = 'Connection error';
        });
    } else {
        document.getElementById('error-message').textContent = 'Missing token.';
    }
</script>
{% endblock %}
