<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Perfume Tracker{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">🌸 Perfume Tracker</a>
        </div>
        <div class="nav-links nav-user" id="nav-user" style="display: none;">
            <a href="/app/perfumes">My Perfumes</a>
            <a href="/app/purchases">Purchases</a>
            <a href="/app/stats">Stats</a>
            <a href="#" onclick="logout()" class="btn-logout">Logout</a>
        </div>
        <div class="nav-links nav-admin" id="nav-admin" style="display: none;">
            <a href="/app/admin">Dashboard</a>
            <a href="/app/admin/users">Users</a>
            <a href="/app/admin/top-users">Top Users</a>
            <a href="#" onclick="logout()" class="btn-logout">Logout</a>
        </div>
        <div class="nav-auth" id="nav-auth">
            <a href="/app/login">Login</a>
            <a href="/app/register">Register</a>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <script>
        let currentUserRole = null;

        async function initNav() {
            const token = localStorage.getItem('access_token');
            if (token) {
                try {
                    const response = await fetch('/auth/me', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (response.ok) {
                        const user = await response.json();
                        currentUserRole = user.role;
                        localStorage.setItem('user_role', user.role);
                        
                        document.getElementById('nav-auth').style.display = 'none';
                        if (user.role === 'ADMIN') {
                            document.getElementById('nav-admin').style.display = 'flex';
                        } else {
                            document.getElementById('nav-user').style.display = 'flex';
                        }
                    } else {
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('user_role');
                        document.getElementById('nav-auth').style.display = 'flex';
                    }
                } catch (err) {
                    document.getElementById('nav-auth').style.display = 'flex';
                }
            } else {
                document.getElementById('nav-auth').style.display = 'flex';
            }
        }

        function logout() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_role');
            window.location.href = '/app/login';
        }

        async function apiRequest(url, options = {}) {
            const token = localStorage.getItem('access_token');
            if (token) {
                options.headers = options.headers || {};
                options.headers['Authorization'] = `Bearer ${token}`;
            }
            const response = await fetch(url, options);
            if (response.status === 401) {
                localStorage.removeItem('access_token');
                localStorage.removeItem('user_role');
                window.location.href = '/app/login';
            }
            return response;
        }

        function requireRole(allowedRoles) {
            const token = localStorage.getItem('access_token');
            const role = localStorage.getItem('user_role');
            
            if (!token) {
                window.location.href = '/app/login';
                return false;
            }
            
            if (role && !allowedRoles.includes(role)) {
                if (role === 'ADMIN') {
                    window.location.href = '/app/admin';
                } else {
                    window.location.href = '/app/perfumes';
                }
                return false;
            }
            return true;
        }

        initNav();
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
